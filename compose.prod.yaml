name: solvcommit-prod

services:
  # ----------------------------------------------------------------------------
  # Caddy Ingress Reverse Proxy (Automatic HTTPS, Let's Encrypt)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: solvcommit-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-solvcommit.eterno.software}
      API_DOMAIN: ${API_DOMAIN:-api.solvcommit.eterno.software}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@solvcommit.dev}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - solvcommit_caddy_data:/data
      - solvcommit_caddy_config:/config
    networks:
      - solvcommit-net
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # React / Vite Static Frontend (Nginx SPA)
  # ----------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/enftaurus/solvcommit-frontend:latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: solvcommit-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - solvcommit-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # SolvCommit Go API Backend Server
  # ----------------------------------------------------------------------------
  api:
    image: ${BACKEND_IMAGE:-ghcr.io/enftaurus/solvcommit-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    container_name: solvcommit-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      PUBLIC_URL: ${PUBLIC_URL:-https://solvcommit.eterno.software}
      DATABASE_URL: postgres://${POSTGRES_USER:-leetsync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leetsync}?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_SUBMISSIONS: ${KAFKA_TOPIC_SUBMISSIONS:-submissions}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      MAX_CODE_BYTES: ${MAX_CODE_BYTES:-262144}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-solvcommit}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-https://solvcommit.eterno.software/api/v1/auth/github/callback}
      AUTO_MIGRATE: "true"
      MIGRATIONS_DIR: "/app/migrations"
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-valyrianminds@zohomail.in}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@solvcommit.dev}
    volumes:
      # Optional mount for GitHub App PEM private key file if supplied via path
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:${GITHUB_APP_PRIVATE_KEY_PATH:-/app/github-app.pem}:ro
    networks:
      - solvcommit-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # SolvCommit Background Publisher Worker
  # ----------------------------------------------------------------------------
  publisher:
    image: ${PUBLISHER_IMAGE:-ghcr.io/enftaurus/solvcommit-publisher:latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: publisher
    container_name: solvcommit-publisher
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-leetsync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leetsync}?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_SUBMISSIONS: ${KAFKA_TOPIC_SUBMISSIONS:-submissions}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:${GITHUB_APP_PRIVATE_KEY_PATH:-/app/github-app.pem}:ro
    networks:
      - solvcommit-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # PostgreSQL Metadata Store
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: solvcommit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leetsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leetsync}
    volumes:
      - solvcommit_postgres_data:/var/lib/postgresql/data
    networks:
      - solvcommit-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-leetsync} -d ${POSTGRES_DB:-leetsync}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Apache Kafka (KRaft mode - Single node, memory-optimized for 4GB VM)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: solvcommit-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_MS: 604800000
      # Limit JVM heap to 512MB to comfortably fit within 4GB Azure VM
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    volumes:
      - solvcommit_kafka_data:/var/lib/kafka/data
    networks:
      - solvcommit-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Kafka Topic Initialization Helper (Runs once then exits)
  # ----------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: solvcommit-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - solvcommit-net
    command: >
      bash -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_SUBMISSIONS:-submissions} --partitions 1 --replication-factor 1 --config retention.ms=604800000 &&
        echo 'Kafka topic submissions verified.'
      "

volumes:
  solvcommit_postgres_data:
    name: solvcommit_postgres_data
  solvcommit_kafka_data:
    name: solvcommit_kafka_data
  solvcommit_caddy_data:
    name: solvcommit_caddy_data
  solvcommit_caddy_config:
    name: solvcommit_caddy_config

networks:
  solvcommit-net:
    name: solvcommit-net
    driver: bridge
