<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SolvCommit</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .badge-paired { background: #065f46; color: #34d399; }
    .badge-unpaired { background: #7f1d1d; color: #f87171; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 13px;
    }
    .stat-label { color: #94a3b8; }
    .stat-val { font-weight: 500; }
    .pair-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
    }
    .pair-toggle-btn {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    .pair-toggle-btn:hover { background: #475569; }
    .pair-form {
      display: none;
      margin-top: 8px;
    }
    .pair-input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px;
      font-size: 11px;
      font-family: monospace;
      border-radius: 4px;
      resize: vertical;
      height: 60px;
      margin-bottom: 6px;
    }
    .pair-input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button.btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
    button.btn-primary:hover { background: #1d4ed8; }
    button.btn-secondary {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
    }
    button.btn-secondary:hover { color: #f8fafc; background: #1e293b; }
    .pair-error {
      color: #f87171;
      font-size: 11px;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">SolvCommit</div>
    <div id="statusBadge" class="status-badge badge-unpaired">Checking...</div>
  </div>

  <div class="stat-row">
    <span class="stat-label">Device ID:</span>
    <span id="deviceIdVal" class="stat-val">-</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Pending Queue:</span>
    <span id="queueCountVal" class="stat-val">0</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Backend Health:</span>
    <span id="healthVal" class="stat-val">Probing...</span>
  </div>

  <div id="pairContainer" class="pair-section">
    <button id="loginPairBtn" class="btn-primary" style="margin-bottom: 8px;">Log in</button>
    <button id="togglePairBtn" class="pair-toggle-btn">Pair Manually</button>
    <div id="pairForm" class="pair-form">
      <textarea id="pairInput" class="pair-input" placeholder="Paste pairing JSON code from dashboard"></textarea>
      <button id="submitPairBtn" class="btn-primary" style="font-size: 11px; padding: 5px;">Connect</button>
      <div id="pairError" class="pair-error"></div>
    </div>
  </div>

  <div class="footer">
    <button id="openDashboardBtn" class="btn-secondary">Open Dashboard</button>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
