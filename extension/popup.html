<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LeetSync</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #38bdf8;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .badge-paired { background: #065f46; color: #34d399; }
    .badge-unpaired { background: #7f1d1d; color: #f87171; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 13px;
    }
    .stat-label { color: #94a3b8; }
    .stat-val { font-weight: 500; }
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      text-align: center;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">LeetSync</div>
    <div id="statusBadge" class="status-badge badge-unpaired">Checking...</div>
  </div>

  <div class="stat-row">
    <span class="stat-label">Device ID:</span>
    <span id="deviceIdVal" class="stat-val">-</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Pending Queue:</span>
    <span id="queueCountVal" class="stat-val">0</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Backend Health:</span>
    <span id="healthVal" class="stat-val">Probing...</span>
  </div>

  <div class="footer">
    <button id="openDashboardBtn">Open Dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
